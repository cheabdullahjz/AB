<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  
  <title>JS Bin</title>
</head>
<body>
<table id='worksheet_table' class="table table-striped">
    <thead>
    <tr>
        <th>Fuel consumption</th>
        <th>Speed</th>
        <th>Distance</th>
        <th>Fuel</th>
        <th>Available Distance</th>
    </tr>
    </thead>
    <tbody>
    <tr class="package-row">
        <td id="FuelConsumption" name="FuelConsumption">Trip 1</td>

        <td><input type="text" name="SpeedVal" id="SpeedVal" class="form-control" onkeydown="this.style.backgroundColor = 'blue';" onkeyup="getValues()"/></td>
        <td><input type="text" name="DistanceVal" id="DistanceVal" class="form-control" onkeydown="this.style.backgroundColor = 'blue';" onkeyup="getValues()"/></td>
        <td><input type="text" name="FuelVal" id="FuelVal" class="form-control" onkeydown="this.style.backgroundColor = 'blue';" onkeyup="getValues()"/></td>
        <td name="AvailableDistance" id="AvailableDistance"></td>
    </tr>

    </tbody>
</table>

<script>
function getValues() {
            var rows = document.querySelectorAll("tr.package-row");
            rows.forEach(function (currentRow) {

                var FuelConsumption = Number(currentRow.querySelector('#FuelConsumption').value);
                var DistanceVal = Number(currentRow.querySelector('#DistanceVal').value);
                var FuelVal = Number(currentRow.querySelector('#FuelVal').value);
                var AvailableDistance = 0;

                document.querySelectorAll('numberUsed');

                if (isNaN(FuelConsumption) || isNaN(DistanceVal)|| isNaN(FuelVal)) {
                        return;
                    }
                AvailableDistance = FuelConsumption * DistanceVal*FuelVal;


                currentRow.querySelector("#AvailableDistance").innerHTML = AvailableDistance;

            });

        }
</script>
  
</body>
</html>
